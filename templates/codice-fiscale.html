<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Calcolo Codice Fiscale</title>
  <style>
    body { font-family: system-ui; max-width: 400px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; }
    button { background: #f39c12; color: white; border: none; cursor: pointer; }
    #msg { padding: 15px; border-radius: 4px; display: none; margin-top: 10px; text-align: center; }
    .ok { background: #d4edda; color: #155724; border: 2px solid #28a745; font-weight: bold; font-size: 1.1em; }
    .err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    a { display: block; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>🧾 Calcola Codice Fiscale</h2>
  <form id="formCF">
    <input type="text" id="token" placeholder="Token" required>
    <input type="number" id="dipId" placeholder="ID Dipendente (1, 2, 3)" min="1" required>
    <button type="submit">Calcola</button>
  </form>
  <div id="msg"></div>
  <a href="index.html">← Torna al Menu</a>

  <script>
    const API = 'http://127.0.0.1:5000/api/codice-fiscale';
    document.getElementById('token').value = sessionStorage.getItem('token') || '';
    document.getElementById('formCF').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            Token: document.getElementById('token').value,
            DipendenteID: parseInt(document.getElementById('dipId').value)
          })
        });
        const data = await res.json();
        msg.className = data.success ? 'ok' : 'err';
        msg.textContent = data.success ? `✅ ${data.CodiceFiscale}` : data.message;
        msg.style.display = 'block';
      } catch (err) {
        msg.className = 'err'; msg.textContent = 'Errore di rete'; msg.style.display = 'block';
      }
    };
  </script>
</body>
</html>
