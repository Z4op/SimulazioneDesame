<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Modifica Password</title>
  <style>
    body { font-family: system-ui; max-width: 400px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; }
    button { background: #9b59b6; color: white; border: none; cursor: pointer; }
    #msg { padding: 10px; border-radius: 4px; display: none; margin-top: 10px; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
    a { display: block; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>🔐 Modifica Password</h2>
  <form id="formPwd">
    <input type="text" id="token" placeholder="Token" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="oldPwd" placeholder="Vecchia Password" required>
    <input type="password" id="newPwd" placeholder="Nuova Password" required>
    <button type="submit">Aggiorna Password</button>
  </form>
  <div id="msg"></div>
  <button id="turnBack">← Torna al Menu</button>

  <script>
    document.getElementById("turnBack").addEventListener("click", function(){
      window.location = "/";
    });
    const API = 'http://127.0.0.1:5000/api/modifica-password';
    document.getElementById('token').value = sessionStorage.getItem('token') || '';
    document.getElementById('formPwd').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            Token: document.getElementById('token').value,
            Email: document.getElementById('email').value,
            VecchiaPassword: document.getElementById('oldPwd').value,
            NuovaPassword: document.getElementById('newPwd').value
          })
        });
        const data = await res.json();
        msg.className = data.success ? 'ok' : 'err';
        msg.textContent = data.message;
        msg.style.display = 'block';
      } catch (err) {
        msg.className = 'err'; msg.textContent = 'Errore di rete'; msg.style.display = 'block';
      }
    };
  </script>
</body>
</html>
