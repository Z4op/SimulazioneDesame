<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Lista Dipendenti</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 40px auto; padding: 20px; }
    input, button { padding: 12px; margin-bottom: 10px; box-sizing: border-box; width: 100%; }
    button { background: #1abc9c; color: white; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95em; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f8f9fa; }
    #msg { padding: 10px; border-radius: 4px; display: none; margin-top: 10px; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
    a { display: block; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>👥 Lista Dipendenti</h2>
  <form id="formList">
    <input type="text" id="token" placeholder="Token" required>
    <button type="submit">Visualizza Dipendenti</button>
  </form>
  <div id="msg"></div>
  <table id="tblDip" style="display:none">
    <thead><tr><th>ID</th><th>Cognome</th><th>Nome</th><th>Nascita</th><th>Sesso</th><th>Comune</th><th>Prov.</th></tr></thead>
    <tbody id="tblBody"></tbody>
  </table>
  <button id="turnBack">← Torna al Menu</button>

  <script>
    document.getElementById("turnBack").addEventListener("click", function(){
      window.location = "/";
    });
    const API = 'http://127.0.0.1:5000/api/lista-dipendenti';
    document.getElementById('token').value = sessionStorage.getItem('token') || '';
    document.getElementById('formList').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const tbl = document.getElementById('tblDip');
      const tbody = document.getElementById('tblBody');
      const token = document.getElementById('token').value.trim();
      if (!token) { alert('Inserisci il token'); return; }
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ Token: token })
        });
        const data = await res.json();
        if (data.success && data.dipendenti) {
          tbody.innerHTML = '';
          data.dipendenti.forEach(d => {
            tbody.innerHTML += `<tr><td>${d.DipendenteID}</td><td>${d.Cognome}</td><td>${d.Nome}</td><td>${d.DataNascita}</td><td>${d.Sesso}</td><td>${d.ComuneNascita}</td><td>${d.ProvinciaNascita}</td></tr>`;
          });
          tbl.style.display = 'table';
          msg.style.display = 'none';
        } else {
          tbl.style.display = 'none';
          msg.className = 'err'; msg.textContent = data.message || 'Errore sconosciuto'; msg.style.display = 'block';
        }
      } catch (err) {
        msg.className = 'err'; msg.textContent = 'Errore di rete'; msg.style.display = 'block';
      }
    };
  </script>
</body>
</html>
